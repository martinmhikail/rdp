name: RDP

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:

      # ============================================================
      # 1. CONFIGURE RDP
      # ============================================================
      - name: Configure RDP
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "================================="
          Write-Host " Configuring Windows Remote Desktop"
          Write-Host "================================="

          # Enable Remote Desktop
          Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server' -Name 'fDenyTSConnections' -Value 0 -Force

          # Normal RDP security negotiation
          Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name 'SecurityLayer' -Value 1 -Force

          # Enable NLA
          Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name 'UserAuthentication' -Value 1 -Force

          # Standard RDP port
          Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name 'PortNumber' -Value 3389 -Force

          # Disable default RDP firewall rules so RDP is not exposed broadly
          Disable-NetFirewallRule -DisplayGroup "Remote Desktop" -ErrorAction SilentlyContinue

          # Delete previous custom rule
          netsh advfirewall firewall delete rule name="RDP-Tailscale" | Out-Null

          # Allow RDP only from Tailscale IPv4 range
          netsh advfirewall firewall add rule name="RDP-Tailscale" dir=in action=allow protocol=TCP localport=3389 remoteip=100.64.0.0/10

          # Ensure TermService starts
          Set-Service -Name TermService -StartupType Automatic

          $service = Get-Service -Name TermService

          if ($service.Status -eq "Running") {
              Restart-Service -Name TermService -Force
          }
          else {
              Start-Service -Name TermService
          }

          Start-Sleep -Seconds 5

          Write-Host ""
          Write-Host "=== TermService ==="
          Get-Service TermService | Format-Table Name, Status, StartType

          Write-Host ""
          Write-Host "=== RDP Sessions ==="
          qwinsta

          Write-Host ""
          Write-Host "RDP configuration finished."


      # ============================================================
      # 2. CREATE / CONFIGURE ADMINISTRATOR
      # ============================================================
      - name: Configure Administrator Account
        shell: pwsh
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "================================="
          Write-Host " Configuring Administrator Account"
          Write-Host "================================="

          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) {
              Write-Error "RDP_PASSWORD secret is empty or missing."
              exit 1
          }

          Write-Host "RDP_PASSWORD loaded successfully."
          Write-Host "Password length: $($env:RDP_PASSWORD.Length)"

          $securePass = ConvertTo-SecureString $env:RDP_PASSWORD -AsPlainText -Force

          $user = Get-LocalUser -Name "Administrator" -ErrorAction SilentlyContinue

          if ($null -eq $user) {
              Write-Host "Administrator account not found."
              Write-Host "Creating Administrator account..."

              New-LocalUser -Name "Administrator" -Password $securePass -AccountNeverExpires -PasswordNeverExpires -Description "RDP Administrator"
          }
          else {
              Write-Host "Administrator already exists."
              Write-Host "Updating password..."

              Set-LocalUser -Name "Administrator" -Password $securePass
              Set-LocalUser -Name "Administrator" -AccountNeverExpires -PasswordNeverExpires $true
          }

          Enable-LocalUser -Name "Administrator"

          # Add user to local administrator group
          Add-LocalGroupMember -Group "Administrators" -Member "Administrator" -ErrorAction SilentlyContinue

          # Permit RDP login
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "Administrator" -ErrorAction SilentlyContinue

          $check = Get-LocalUser -Name "Administrator" -ErrorAction Stop

          Write-Host ""
          Write-Host "=== ACCOUNT CHECK ==="
          Write-Host "Username : $($check.Name)"
          Write-Host "Enabled  : $($check.Enabled)"
          Write-Host "SID      : $($check.SID)"
          Write-Host "====================="

          if (-not $check.Enabled) {
              Write-Error "Administrator account is disabled."
              exit 1
          }

          Write-Host "Administrator account ready."


      # ============================================================
      # 3. INSTALL TAILSCALE
      # ============================================================
      - name: Install Tailscale
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "================================="
          Write-Host " Installing Tailscale"
          Write-Host "================================="

          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installerPath = "$env:TEMP\tailscale.msi"

          Write-Host "Downloading Tailscale..."

          Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath

          if (-not (Test-Path $installerPath)) {
              Write-Error "Tailscale installer download failed."
              exit 1
          }

          Write-Host "Installing Tailscale..."

          $process = Start-Process -FilePath "msiexec.exe" -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" -Wait -PassThru

          if ($process.ExitCode -ne 0) {
              Write-Error "Tailscale installation failed. Exit code: $($process.ExitCode)"
              exit 1
          }

          Remove-Item $installerPath -Force -ErrorAction SilentlyContinue

          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (-not (Test-Path $ts)) {
              Write-Error "tailscale.exe not found after installation."
              exit 1
          }

          Write-Host "Tailscale installation successful."

          & $ts version


      # ============================================================
      # 4. CONNECT TAILSCALE
      # ============================================================
      - name: Connect Tailscale
        shell: pwsh
        env:
          TS_AUTHKEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "================================="
          Write-Host " Connecting Tailscale"
          Write-Host "================================="

          # IMPORTANT:
          # Repository secret TAILSCALE_AUTH_KEY is mapped
          # to PowerShell environment variable TS_AUTHKEY.

          if ([string]::IsNullOrWhiteSpace($env:TS_AUTHKEY)) {
              Write-Error "TAILSCALE_AUTH_KEY was not passed to this workflow."
              exit 1
          }

          Write-Host "TAILSCALE_AUTH_KEY loaded."
          Write-Host "Auth key length: $($env:TS_AUTHKEY.Length)"

          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (-not (Test-Path $ts)) {
              Write-Error "tailscale.exe not found."
              exit 1
          }

          $hostname = "gh-rdp-$env:GITHUB_RUN_ID"

          Write-Host "Tailscale hostname: $hostname"
          Write-Host "Connecting..."

          $tsArgs = @(
              "up"
              "--authkey=$env:TS_AUTHKEY"
              "--hostname=$hostname"
          )

          & $ts @tsArgs

          if ($LASTEXITCODE -ne 0) {
              Write-Error "tailscale up failed with exit code $LASTEXITCODE"
              exit 1
          }

          Write-Host ""
          Write-Host "Waiting for Tailscale IPv4 address..."

          $tsIP = $null

          for ($i = 1; $i -le 30; $i++) {

              $candidate = & $ts ip -4 2>$null | Select-Object -First 1

              if (-not [string]::IsNullOrWhiteSpace($candidate)) {
                  $tsIP = $candidate.Trim()
                  break
              }

              Write-Host "Waiting for IP... $i/30"
              Start-Sleep -Seconds 3
          }

          if ([string]::IsNullOrWhiteSpace($tsIP)) {
              Write-Host ""
              Write-Host "Tailscale status:"
              & $ts status

              Write-Error "Tailscale IPv4 address was not assigned."
              exit 1
          }

          "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV
          "RDP_HOSTNAME=$hostname" >> $env:GITHUB_ENV

          Write-Host ""
          Write-Host "================================="
          Write-Host " TAILSCALE CONNECTED"
          Write-Host "================================="
          Write-Host "IP       : $tsIP"
          Write-Host "Hostname : $hostname"
          Write-Host "================================="

          & $ts status


      # ============================================================
      # 5. VERIFY RDP
      # ============================================================
      - name: Verify RDP
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "================================="
          Write-Host " Verifying RDP"
          Write-Host "================================="

          Write-Host "Tailscale IP: $env:TAILSCALE_IP"

          if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_IP)) {
              Write-Error "TAILSCALE_IP is missing."
              exit 1
          }

          # ---------------------------------
          # Check TermService
          # ---------------------------------

          $service = Get-Service -Name TermService

          Write-Host ""
          Write-Host "TermService status: $($service.Status)"

          if ($service.Status -ne "Running") {
              Write-Host "Starting TermService..."

              Start-Service TermService
              Start-Sleep -Seconds 3
          }

          # ---------------------------------
          # Check Administrator
          # ---------------------------------

          $user = Get-LocalUser -Name "Administrator" -ErrorAction SilentlyContinue

          if ($null -eq $user) {
              Write-Error "Administrator account does not exist."
              exit 1
          }

          if (-not $user.Enabled) {
              Write-Error "Administrator account is disabled."
              exit 1
          }

          Write-Host "Administrator account: OK"

          # ---------------------------------
          # Check RDP listener
          # ---------------------------------

          Write-Host ""
          Write-Host "Checking RDP TCP port 3389..."

          $listener = Get-NetTCPConnection -LocalPort 3389 -State Listen -ErrorAction SilentlyContinue

          if (-not $listener) {
              Write-Host "RDP listener missing. Restarting TermService..."

              Restart-Service TermService -Force
              Start-Sleep -Seconds 5

              $listener = Get-NetTCPConnection -LocalPort 3389 -State Listen -ErrorAction SilentlyContinue
          }

          if (-not $listener) {
              Write-Error "RDP is not listening on TCP port 3389."
              exit 1
          }

          Write-Host "RDP TCP 3389 listener: OK"

          # ---------------------------------
          # Show sessions
          # ---------------------------------

          Write-Host ""
          Write-Host "=== RDP SESSION INFO ==="
          qwinsta

          # ---------------------------------
          # Test local TCP connection
          # ---------------------------------

          Write-Host ""
          Write-Host "Testing TCP connection..."

          $test = Test-NetConnection -ComputerName $env:TAILSCALE_IP -Port 3389 -WarningAction SilentlyContinue

          Write-Host "TcpTestSucceeded: $($test.TcpTestSucceeded)"

          if (-not $test.TcpTestSucceeded) {
              Write-Error "TCP connection to RDP port 3389 failed."
              exit 1
          }

          Write-Host ""
          Write-Host "================================="
          Write-Host " RDP VERIFICATION SUCCESSFUL"
          Write-Host "================================="


      # ============================================================
      # 6. MAINTAIN CONNECTION
      # ============================================================
      - name: Maintain Connection
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "==========================================="
          Write-Host "                RDP READY"
          Write-Host "==========================================="
          Write-Host ""
          Write-Host "Address : $env:TAILSCALE_IP"
          Write-Host "Username: .\Administrator"
          Write-Host "Password: value stored in RDP_PASSWORD"
          Write-Host ""
          Write-Host "Hostname: $env:RDP_HOSTNAME"
          Write-Host ""
          Write-Host "Connect while this workflow is running."
          Write-Host "Cancel workflow when finished."
          Write-Host ""
          Write-Host "==========================================="

          while ($true) {

              $service = Get-Service -Name TermService -ErrorAction SilentlyContinue

              if ($null -eq $service) {
                  Write-Host "[$(Get-Date)] ERROR: TermService not found."
              }
              elseif ($service.Status -ne "Running") {
                  Write-Host "[$(Get-Date)] TermService stopped. Restarting..."
                  Start-Service -Name TermService
              }

              Write-Host "[$(Get-Date)] RDP active - $env:TAILSCALE_IP"

              Start-Sleep -Seconds 300
          }
