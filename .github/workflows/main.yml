name: RDP

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Configure RDP
        shell: pwsh
        run: |
          Write-Host "Configuring RDP..."

          # Enable Remote Desktop
          Set-ItemProperty `
            -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server' `
            -Name 'fDenyTSConnections' `
            -Value 0 `
            -Force

          # Use normal RDP negotiation
          Set-ItemProperty `
            -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name 'SecurityLayer' `
            -Value 1 `
            -Force

          # Enable NLA
          Set-ItemProperty `
            -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name 'UserAuthentication' `
            -Value 1 `
            -Force

          # Enable RDP firewall rules
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop" -ErrorAction SilentlyContinue

          # Tailscale-only RDP firewall rule
          netsh advfirewall firewall delete rule name="RDP-Tailscale"
          netsh advfirewall firewall add rule name="RDP-Tailscale" dir=in action=allow protocol=TCP localport=3389 remoteip=100.64.0.0/10

          # Make sure RDP service is alive
          Set-Service TermService -StartupType Automatic
          Restart-Service TermService -Force

          Start-Sleep -Seconds 5

          Write-Host "RDP listeners:"
          qwinsta

          Get-NetTCPConnection -LocalPort 3389 -State Listen -ErrorAction SilentlyContinue

      - name: Configure Administrator Account
        shell: pwsh
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          $user = Get-LocalUser -Name "Administrator" -ErrorAction Stop

          $securePass = ConvertTo-SecureString `
            $env:RDP_PASSWORD `
            -AsPlainText `
            -Force

          Set-LocalUser `
            -Name "Administrator" `
            -Password $securePass `
            -AccountNeverExpires

          Enable-LocalUser -Name "Administrator"

          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member "Administrator" `
            -ErrorAction SilentlyContinue

          Write-Host "Administrator enabled."

          $admin = Get-LocalUser -Name "Administrator"

          Write-Host "Enabled: $($admin.Enabled)"

          if (-not $admin.Enabled) {
              Write-Error "Administrator account is disabled."
              exit 1
          }

      - name: Install Tailscale
        shell: pwsh
        run: |
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installerPath = "$env:TEMP\tailscale.msi"

          Invoke-WebRequest `
            -Uri $tsUrl `
            -OutFile $installerPath

          Start-Process `
            msiexec.exe `
            -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" `
            -Wait

          Remove-Item $installerPath -Force

      - name: Connect Tailscale
        shell: pwsh
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"

          & $ts up `
            --authkey="$env:TAILSCALE_AUTH_KEY" `
            --hostname="gh-rdp-$env:GITHUB_RUN_ID"

          $tsIP = $null

          for ($i = 0; $i -lt 20; $i++) {
              $tsIP = (& $ts ip -4 2>$null | Select-Object -First 1)

              if ($tsIP) {
                  break
              }

              Write-Host "Waiting for Tailscale..."
              Start-Sleep -Seconds 3
          }

          if (-not $tsIP) {
              Write-Error "No Tailscale IP."
              exit 1
          }

          "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV

          Write-Host "================================"
          Write-Host "Tailscale IP: $tsIP"
          Write-Host "Username    : Administrator"
          Write-Host "================================"

      - name: Verify RDP
        shell: pwsh
        run: |
          Write-Host "Checking TermService..."

          $service = Get-Service TermService

          Write-Host "Status: $($service.Status)"

          if ($service.Status -ne "Running") {
              Write-Error "TermService isn't running."
              exit 1
          }

          Write-Host "Checking port 3389..."

          $rdp = Get-NetTCPConnection `
            -LocalPort 3389 `
            -State Listen `
            -ErrorAction SilentlyContinue

          if (-not $rdp) {
              Write-Error "RDP is not listening on port 3389."
              exit 1
          }

          Write-Host "RDP listener OK."

          qwinsta

      - name: Maintain Connection
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "================================="
          Write-Host "         RDP READY"
          Write-Host "================================="
          Write-Host "Address : $env:TAILSCALE_IP"
          Write-Host "Username: Administrator"
          Write-Host "================================="
          Write-Host ""

          while ($true) {
              Write-Host "[$(Get-Date)] RDP active"
              Start-Sleep -Seconds 300
          }
